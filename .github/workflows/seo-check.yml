name: DIGRIX SEO and live publication checks

on:
  push:
    branches:
      - main
      - feature/technical-seo-and-audit-2026-11-04
  pull_request:
  workflow_dispatch:

jobs:
  static-seo:
    name: Check metadata, sitemap, internal links
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Validate audit scripts
        run: |
          node --check tools/seo-audit.mjs
          node --check tools/live-seo-check.mjs
      - name: Audit HTML and SEO files
        run: node tools/seo-audit.mjs

  public-pages:
    name: Verify real public site URLs
    runs-on: ubuntu-latest
    needs: static-seo
    if: github.event_name != 'pull_request'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: HTTP status, content, sitemap and robots checks
        env:
          STRICT_LIVE: ${{ github.ref == 'refs/heads/main' }}
        run: node tools/live-seo-check.mjs
